# frontend's k8s resources, applied by the Flux Kustomization in cluster/me/frontend-sync.yaml.
# Every ${APP_*} placeholder is substituted by Flux (postBuild) from the project-me-prod-shared-config
# and project-me-frontend-prod-config ConfigMaps (templates: templates/shared-configmap.example.yaml,
# templates/frontend-configmap.example.yaml), plus APP_IMAGE_TAG from the sync file, which the app
# repository updates on main. No project values live here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - middleware.yaml
  - ingress.yaml
