# Public HTTPS entry for the frontend on the k3s-bundled Traefik, at the bare APP_DOMAIN
# (admin.<domain> is cms-admin, api.<domain> is cms-api). All paths go to the Service. cert-manager
# issues the <svc>-<env>-tls certificate from the ClusterIssuer in ${APP_TLS_CLUSTER_ISSUER}.
# Fail-closed on a missing APP_DOMAIN: a bare ${APP_DOMAIN} would substitute to nothing, which YAML
# reads as null, dropping the rule host and exposing a catch-all. Flux has no ${var:?} form, so the
# host uses ${APP_DOMAIN:=APP_DOMAIN-is-not-set}: when it's unset or empty, the host becomes that
# placeholder, which isn't a valid DNS name (uppercase), so the API server rejects the Ingress and the
# Flux apply fails with the reason in the error. Keep the same form in tls and rules.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${APP_SERVICE_NAME}-${APP_ENV}
  namespace: ${APP_NAMESPACE}-${APP_ENV}
  labels:
    app.kubernetes.io/name: ${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}
  annotations:
    cert-manager.io/cluster-issuer: ${APP_TLS_CLUSTER_ISSUER}
    # <middleware namespace>-<middleware name>@kubernetescrd, see middleware.yaml.
    traefik.ingress.kubernetes.io/router.middlewares: ${APP_NAMESPACE}-${APP_ENV}-${APP_SERVICE_NAME}-${APP_ENV}-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${APP_DOMAIN:=APP_DOMAIN-is-not-set}
      secretName: ${APP_SERVICE_NAME}-${APP_ENV}-tls
  rules:
    - host: ${APP_DOMAIN:=APP_DOMAIN-is-not-set}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${APP_SERVICE_NAME}-${APP_ENV}
                port:
                  name: http
