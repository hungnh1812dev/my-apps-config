# cms-api's k8s resources, applied by the Flux Kustomization cms-api-sync (cluster-base/cms-api-sync.yaml).
# Every ${APP_*} placeholder is substituted by Flux (postBuild) from the shared-config and cms-api-config
# ConfigMaps in the environment's namespace (templates: templates/shared-configmap.example.yaml,
# templates/cms-api-configmap.example.yaml), plus APP_IMAGE_TAG from cluster/me/<env>/cms-api-sync-overlay.yaml,
# which the app repository updates. No project values live here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - middleware.yaml
  - ingress.yaml
