# cms-api runtime Secret template: the app's config and secrets, loaded into both containers via
# envFrom. Placeholders only; never commit real values. Created by hand before the first Flux deploy:
#   cp templates/cms-api-secret.example.yaml templates/cms-api-secret.yaml   # gitignored; fill in names + values
#   kubectl apply --server-side -f templates/cms-api-secret.yaml
# (--server-side: a plain `kubectl apply` would also store every value in plain text in the
# last-applied-configuration annotation.)
# The namespace <app-namespace>-<app-env> must exist first (kubectl create namespace ...).
# To change a value later: edit templates/cms-api-secret.yaml, re-apply the same way, then
#   kubectl -n <app-namespace>-<app-env> rollout restart deploy/<app-service-name>-<app-env>
# (pods only read the Secret at start).
#
# Rules for values:
# - Quote every value ("true", "5432"): Secret data must be strings.
# - Optional keys are commented out. Uncomment only the ones you use. Don't set an optional key to "":
#   an empty value is not "unset" (e.g. RATE_LIMIT_FPS: "" fails validation and the app won't boot).
# - Don't set PORT or any APP_*: the Deployment sets PORT from the ConfigMap's APP_PORT, and project
#   info lives in the ConfigMaps (templates/shared-configmap.example.yaml,
#   templates/cms-api-configmap.example.yaml).
# - metadata.name must be <app-service-name>-<app-env>-secrets, which is what the Deployment's envFrom
#   references (e.g. cms-api-prod-secrets).
# Every key the app reads is documented in apps/cms-api/.env.example in the app repository.
apiVersion: v1
kind: Secret
metadata:
  name: <app-service-name>-<app-env>-secrets
  namespace: <app-namespace>-<app-env>
type: Opaque
stringData:
  # ── JWT (required): generate each with `openssl rand -base64 32` ─────────────
  JWT_ACCESS_SECRET: "<random-secret>"
  JWT_REFRESH_SECRET: "<random-secret>"

  # ── Cookie ───────────────────────────────────────────────────────────────────
  COOKIE_SECURE: "true"
  COOKIE_SAMESITE: "lax"

  # ── CORS (required): comma-separated exact origins ───────────────────────────
  CORS_ORIGINS: "<https://admin.example.com>"

  # ── Reverse-proxy hops. 1 = one hop (the k3s Traefik Ingress) ────────────────
  TRUST_PROXY: "1"

  # ── Rate limit (auth-mutation routes). Defaults: 5 / 10 ──────────────────────
  # RATE_LIMIT_FPS: "5"
  # RATE_LIMIT_BURST: "10"

  # ── Content types dir. Default: content-types ────────────────────────────────
  # CONTENT_TYPES_DIR: "content-types"

  # ── Media: max upload bytes. Default: 10485760 (10 MiB) ──────────────────────
  # MEDIA_MAX_UPLOAD_BYTES: "10485760"

  # ── Database (required): Postgres, e.g. on the Mac via its bridge IP ─────────
  DB_HOST: "<db-host>"
  DB_PORT: "5432"
  DB_NAME: "<db-name>"
  DB_USERNAME: "<db-username>"
  DB_PASSWORD: "<db-password>"

  # ── Storage: cloudinary (default) or s3. Uncomment the provider you use ──────
  STORAGE_PROVIDER: "cloudinary"
  # CLOUDINARY_CLOUD_NAME: "<cloud-name>"
  # CLOUDINARY_API_KEY: "<api-key>"
  # CLOUDINARY_API_SECRET: "<api-secret>"
  # AWS_REGION: "<region>"
  # AWS_S3_BUCKET: "<bucket>"

  # ── Email: gmail | smtp | resend | brevo | console. Uncomment what the provider needs
  EMAIL_PROVIDER: "console"
  EMAIL_FROM: "no-reply@example.com"
  # FRONTEND_URL: "<https://frontend.example.com>"
  # SMTP_HOST: "<smtp-host>"
  # SMTP_PORT: "587"
  # SMTP_USER: "<smtp-user>"
  # SMTP_PASSWORD: "<smtp-password>"
  # SMTP_SECURE: "false"
  # GMAIL_CLIENT_ID: "<client-id>"
  # GMAIL_CLIENT_SECRET: "<client-secret>"
  # GMAIL_REFRESH_TOKEN: "<refresh-token>"
  # GMAIL_SENDER_EMAIL: "<sender@example.com>"
  # RESEND_API_KEY: "<api-key>"
  # BREVO_API_KEY: "<api-key>"

  # ── Redis (optional refresh-token blacklist cache). REDIS_URL required if "true"
  REDIS_ENABLED: "false"
  # REDIS_URL: "<redis://host:6379>"
