# frontend: applies ./apps/frontend with ${APP_*} from the shared ConfigMap, then the
# frontend ConfigMap (a key in both takes the frontend value). APP_IMAGE_TAG is committed to main by
# the app repository after it pushes a new image; Flux applies it on its next poll. Keep exactly one
# `APP_IMAGE_TAG:` line: the app repository rewrites it.
# No dependsOn cms-api on purpose: the frontend's probes tolerate cms-api being down, and a
# dependsOn would block frontend deploys whenever cms-api's Kustomization isn't Ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${APP_NAME}-frontend-sync-${APP_ENV}
  namespace: flux-system
spec:
  interval: 3m
  # A failed apply is retried sooner than the next interval.
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Includes the public Traefik Ingress at the bare <domain>. Needs APP_DOMAIN and
  # APP_TLS_CLUSTER_ISSUER in the shared ConfigMap before this reaches the cluster.
  path: ./apps/frontend
  prune: true
  wait: true
  timeout: 5m
  postBuild:
    # Both ConfigMaps must exist: a missing one fails the Kustomization instead of rendering empty names.
    # ${APP_NAME}/${APP_ENV} in the names here are filled in by the root Kustomization, from
    # shared-config (cluster/me/flux-system/kustomization.yaml); the apps still read it themselves.
    substituteFrom:
      - kind: ConfigMap
        name: shared-config
      - kind: ConfigMap
        name: ${APP_NAME}-frontend-${APP_ENV}-config
    substitute:
      APP_IMAGE_TAG: "dev"
