# frontend image tag in prod. The app repository's pipeline rewrites the one line starting with
# `APP_IMAGE_TAG:` and commits it to the main branch; Flux applies it on its next poll. Keep exactly one.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: frontend-sync
spec:
  postBuild:
    substitute:
      APP_IMAGE_TAG: "dev"
