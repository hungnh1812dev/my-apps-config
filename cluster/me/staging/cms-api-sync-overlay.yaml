# cms-api image tag in staging. The app repository's pipeline rewrites the one line starting with
# `APP_IMAGE_TAG:` and commits it to the staging branch; Flux applies it on its next poll. Keep exactly one.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cms-api-sync
spec:
  postBuild:
    substitute:
      APP_IMAGE_TAG: "staging-681e755"
