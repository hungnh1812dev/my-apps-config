apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
# Hand-written; `flux bootstrap` keeps this file and only rewrites gotk-*.yaml.
patches:
# The root Kustomization substitutes ${APP_*} in everything under cluster/me from the shared
# ConfigMap, so the sync files can name themselves and their per-app ConfigMap from APP_NAME and
# APP_ENV. The ConfigMap's name is fixed (a variable can't name its own source) and it must exist
# before bootstrap, or the root Kustomization, which also manages Flux, fails.
- target:
    kind: Kustomization
    name: flux-system
  patch: |
    - op: add
      path: /spec/postBuild
      value:
        substituteFrom:
          - kind: ConfigMap
            name: shared-config
# Flux's own manifests skip that substitution: gotk-components.yaml has ${var:=default}-style
# examples in a CRD description that it would rewrite. kind/name below are ignored; the target selects.
- target:
    labelSelector: app.kubernetes.io/part-of=flux
  patch: |
    apiVersion: v1
    kind: not-used
    metadata:
      name: not-used
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
