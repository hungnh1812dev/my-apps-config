# cms-api in prod: applies ./apps/cms-api with ${APP_*} from the shared ConfigMap, then the
# cms-api ConfigMap (a key in both takes the cms-api value). APP_IMAGE_TAG is committed to main by
# the app repository after it pushes a new image; Flux applies it on its next poll. Keep exactly one
# `APP_IMAGE_TAG:` line: the app repository rewrites it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: project-me-cms-api-sync-prod
  namespace: flux-system
spec:
  interval: 3m
  # A failed apply is retried sooner than the next interval.
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Includes the public Traefik Ingress at api.<domain>. Needs APP_DOMAIN and
  # APP_TLS_CLUSTER_ISSUER in the shared ConfigMap before this reaches the cluster.
  path: ./apps/cms-api
  prune: true
  wait: true
  timeout: 5m
  postBuild:
    # Both ConfigMaps must exist: a missing one fails the Kustomization instead of rendering empty names.
    substituteFrom:
      - kind: ConfigMap
        name: project-me-prod-shared-config
      - kind: ConfigMap
        name: project-me-cms-api-prod-config
    substitute:
      APP_IMAGE_TAG: "81-47e63ce-amd64"
